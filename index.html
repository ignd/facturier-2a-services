<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Facturier 2A Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: form panel on the left, live A4 invoice preview on the right (stacked on phones). */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --fg: #14213a;
  --muted: #5d6b85;
  --line: #d9dfeb;
  --field: #f6f8fc;
  --brand: #0b55a5;      /* 2A blue */
  --brand-ink: #ffffff;
  --red: #d92b2b;        /* 2A red */
  --ok: #1c7c4d;
  /* paper stays white in both themes: it is a document */
  --paper: #ffffff;
  --ink: #101a2e;
  --ink-soft: #55627c;
  --rule: #cfd7e6;
  --tint: #eef3fb;
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-logo: "Barlow Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1424; --panel: #151e33; --fg: #e8edf8; --muted: #93a1bf; --line: #27344f;
    --field: #0f1729; --brand: #4d94e6; --brand-ink: #06122a; --red: #ff6b6b; --ok: #58c98d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1424; --panel: #151e33; --fg: #e8edf8; --muted: #93a1bf; --line: #27344f;
  --field: #0f1729; --brand: #4d94e6; --brand-ink: #06122a; --red: #ff6b6b; --ok: #58c98d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 24px 48px; }
.app { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 980px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* ---------- form panel ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 22px; min-width: 0; }
.brandbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brandbar h1 { font-family: var(--f-display); font-weight: 400; font-size: 2rem; line-height: 1; margin: 0; letter-spacing: -.01em; }
.brandbar span { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; min-width: 0; }
legend { padding: 0; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; width: 100%; }
legend::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
label { display: grid; gap: 5px; font-size: .78rem; color: var(--muted); font-weight: 500; min-width: 0; }
input, textarea { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 96px; line-height: 1.45; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
input[type="number"] { font-variant-numeric: tabular-nums; }

.lines { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) 62px 104px 34px; gap: 8px; align-items: end; padding: 10px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
.line input { background: var(--panel); }
.line .rm { height: 38px; }
.line .desig { grid-column: 1 / -1; }
.line .sub { grid-column: 1 / 4; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; }
@media (max-width: 420px) { .line { grid-template-columns: 56px minmax(0, 1fr) 34px; } .line .sub { grid-column: 1 / 3; } }
.btn { font: inherit; font-weight: 600; font-size: .88rem; border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); color: var(--brand-ink); }
.btn.icon { padding: 0; width: 34px; height: 38px; line-height: 1; font-size: 1.1rem; color: var(--muted); }
.btn.icon:hover { color: var(--red); border-color: var(--red); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hint { font-size: .78rem; color: var(--muted); margin: 0; }
.toast { color: var(--ok); font-size: .82rem; font-weight: 600; min-height: 1.2em; }

/* ---------- preview ---------- */
.stage { min-width: 0; position: sticky; top: 16px; }
@media (max-width: 980px) { .stage { position: static; } }
.paper { container-type: inline-size; width: 100%; max-width: 860px; margin: 0 auto; background: var(--paper); box-shadow: 0 1px 2px rgba(10,20,40,.10), 0 18px 50px -12px rgba(10,20,40,.28); border-radius: 3px; overflow: hidden; }
.sheet { --f-display: "Montserrat", "Segoe UI", system-ui, sans-serif; text-transform: uppercase; font-size: 1.55cqw; color: var(--ink); font-family: "Montserrat", "Segoe UI", system-ui, sans-serif; line-height: 1.4; aspect-ratio: 210 / 297; display: flex; flex-direction: column; padding: 5.2em 5.2em 0; position: relative; }
.sheet::before { content: ""; position: absolute; inset: 0 0 auto 0; height: .9em; background: linear-gradient(90deg, #0b55a5 0 82%, #d92b2b 82% 100%); }
.sheet { isolation: isolate; background:
  radial-gradient(ellipse at 50% 48%, #fff 0 22%, rgba(255,255,255,0) 72%),
  repeating-radial-gradient(circle at 0 0, transparent 0 .5em, rgba(11,85,165,.075) .5em .56em),
  repeating-radial-gradient(circle at 100% 100%, transparent 0 .5em, rgba(217,43,43,.06) .5em .56em),
  #fff; }
.wm { position: absolute; z-index: -1; left: 50%; top: 47%; width: 62%; transform: translate(-50%, -50%) rotate(-18deg); opacity: .07; filter: grayscale(.2); mix-blend-mode: multiply; pointer-events: none; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 2em; }
.logo { width: 22em; flex: none; }
.logocrop { width: 100%; aspect-ratio: 332 / 118; overflow: hidden; }
.logocrop img { display: block; width: 231.3%; max-width: none; margin-left: -21.7%; margin-top: -12.65%; }
.title { text-align: right; }
.title .kicker { font-size: .78em; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.title h2 { font-family: var(--f-display); font-weight: 800; font-size: 3.3em; line-height: 1; margin: .15em 0 .2em; letter-spacing: .04em; color: #0b55a5; }
.title .num { font-size: 1.15em; font-weight: 700; font-variant-numeric: tabular-nums; }
.title .num em { font-style: normal; color: #d92b2b; }
.meta { display: grid; grid-template-columns: 1.15fr .85fr; gap: 2em; margin-top: 2.4em; padding-top: 1.4em; border-top: 1px solid var(--rule); }
.meta .k { font-size: .72em; text-transform: uppercase; letter-spacing: .18em; color: var(--ink-soft); font-weight: 600; margin-bottom: .5em; }
.meta .who { font-family: "Hanken Grotesk", system-ui, sans-serif; font-weight: 700; font-size: 1.75em; line-height: 1.15; letter-spacing: .01em; }
.meta .sub { color: var(--ink-soft); margin-top: .25em; }
.meta .when { text-align: right; }
.meta .when .v { font-size: 1.1em; font-weight: 600; }
table.items { width: 100%; border-collapse: collapse; margin-top: 2.2em; font-variant-numeric: tabular-nums; }
.items th { background: #0b55a5; color: #fff; font-size: .74em; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; padding: .85em 1em; text-align: right; }
.items th:first-child { text-align: left; }
.items td { padding: .95em 1em; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; height: 3.3em; }
.items td:first-child { text-align: left; white-space: normal; font-weight: 600; }
.items td.q { text-align: center; }
.items th.q { text-align: center; }
.items tr:nth-child(even) td { background: var(--tint); }
.items tr.blank td { color: transparent; font-weight: 400; }
.totals { margin-left: auto; width: 55%; margin-top: 1.4em; font-variant-numeric: tabular-nums; }
.totals .r { display: flex; justify-content: space-between; padding: .5em 1em; color: var(--ink-soft); }
.totals .grand { display: flex; justify-content: space-between; align-items: baseline; margin-top: .4em; padding: .9em 1em; background: #0b55a5; color: #fff; }
.totals .grand span { font-size: .78em; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
.totals .grand b { font-family: var(--f-display); font-weight: 700; font-size: 1.45em; line-height: 1; }
.words { margin-top: 1.6em; padding: 1em 1.2em; border-left: .3em solid #d92b2b; background: var(--tint); }
.words small { display: block; font-size: .7em; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; margin-bottom: .2em; }
.words strong { font-weight: 700; letter-spacing: .02em; }
.pn { font-weight: 400; font-size: .86em; color: var(--ink-soft); margin-top: .2em; white-space: pre-line; }
.foot { display: grid; grid-template-columns: minmax(0, 1fr) 17em; gap: 2.4em; margin-top: 1.8em; align-items: start; }
.nb { font-size: .86em; color: var(--ink-soft); }
.nb h4 { margin: 0 0 .5em; font-size: 1.05em; letter-spacing: .04em; color: #d92b2b; font-weight: 700; text-decoration: underline; text-underline-offset: .25em; }
.nb ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .4em; }
.nb li { padding-left: 1.2em; position: relative; }
.nb li::before { content: "•"; position: absolute; left: .2em; color: #0b55a5; font-weight: 700; }
.sign { text-align: center; }
.sign .dir { font-weight: 700; letter-spacing: .12em; font-size: .86em; text-decoration: underline; text-underline-offset: .3em; }
.stampcrop { width: 100%; aspect-ratio: 184 / 104; overflow: hidden; margin-top: .3em; }
.stampcrop img { display: block; width: 417.4%; max-width: none; margin-left: -309.8%; margin-top: -331.5%; mix-blend-mode: multiply; }
.bottom { margin-top: auto; padding: 0 0 2.2em; color: #1b74cc; font-size: .8em; line-height: 1.45; text-align: center; }
.bottom u { text-transform: none; }
.bottom .rl { display: block; height: 1px; background: #d92b2b; margin-bottom: .9em; position: relative; }
.bottom .rl::before, .bottom .rl::after { content: ""; position: absolute; top: -.2em; width: .42em; height: .42em; border-radius: 50%; background: #d92b2b; }
.bottom .rl::before { left: 0; } .bottom .rl::after { right: 0; }
.paper[hidden] { display: none; }

@media print {
  body { background: #fff; padding: 0; }
  .panel { display: none; }
  .app { display: block; }
  .stage { position: static; }
  .paper { box-shadow: none; }
}
@media (prefers-reduced-motion: no-preference) { .btn { transition: border-color .15s, color .15s, filter .15s; } }
</style>

</head>
<body>
<div class="app">
  <form class="panel" id="form" autocomplete="off">
    <div class="brandbar"><h1>Facturier</h1><span>2A Services</span></div>

    <fieldset>
      <legend>Client</legend>
      <label for="client">Nom du client
        <input id="client" data-k="client" type="text"></label>
      <label for="ville">Adresse / ville
        <input id="ville" data-k="ville" type="text"></label>
    </fieldset>

    <fieldset>
      <legend>Facture</legend>
      <div class="row">
        <label for="num">Numéro
          <input id="num" data-k="num" type="text"></label>
        <label for="date">Date
          <input id="date" data-k="date" type="date"></label>
      </div>
      <label for="lieu">Établie à
        <input id="lieu" data-k="lieu" type="text"></label>
    </fieldset>

    <fieldset>
      <legend>Prestations</legend>
      <div class="lines" id="lines"></div>
      <div class="actions"><button type="button" class="btn" id="add">+ Ajouter une ligne</button></div>
      <div class="row">
        <label for="tva">TVA (%)
          <input id="tva" data-k="tva" type="number" min="0" max="100" step="0.5" inputmode="decimal"></label>
        <label for="remise">Remise (FCFA)
          <input id="remise" data-k="remise" type="number" min="0" step="500" inputmode="numeric"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>NB</legend>
      <label for="nb">Une mention par ligne
        <textarea id="nb" data-k="nb" rows="5"></textarea></label>
    </fieldset>

    <fieldset>
      <legend>Pied de page</legend>
      <label for="adresse">Adresse
        <input id="adresse" data-k="adresse" type="text"></label>
      <div class="row">
        <label for="rc">RC
          <input id="rc" data-k="rc" type="text"></label>
        <label for="ninea">NINEA
          <input id="ninea" data-k="ninea" type="text"></label>
      </div>
      <label for="tel">Téléphones
        <input id="tel" data-k="tel" type="text"></label>
      <label for="banque">Compte bancaire
        <input id="banque" data-k="banque" type="text"></label>
      <label for="email">Email
        <input id="email" data-k="email" type="text"></label>
    </fieldset>

    <div class="actions">
      <button type="button" class="btn primary" id="copy">Copier le texte</button>
      <button type="button" class="btn" id="fresh">Nouvelle facture</button>
    </div>
    <p class="toast" id="toast" role="status"></p>
    <p class="hint">Les modifications sont enregistrées dans ce navigateur. Pour imprimer, utilisez Ctrl+P : seule la facture est imprimée.</p>
  </form>

  <div class="stage"><div class="paper"><div class="sheet" id="sheet"></div></div></div>
</div>

<script>
(function () {
  var KEY = "facturier-2a-v2";
  var DEFAULT = {
    client: "WAVE MOBILE MONEY", ville: "Dakar – Sénégal", num: "483-25", date: "2025-12-31", lieu: "Dakar",
    lines: [{ d: "Impression Gros Chèque", q: 1, p: 25000 }],
    tva: 0, remise: 0,
    nb: "Cette facture est payable à réception.\nTout règlement s'effectue en Francs CFA (FCFA).\nLes travaux d'impression validés ne sont ni repris ni échangés après livraison.",
    rc: "SN DKR 2016 A 29669", ninea: "6194063", tel: "33 825 64 73 / 77 410 55 83",
    adresse: "Point E Rue 4 x H Villa N°14 derrière les Ambassades Point E Dakar – SENEGAL",
    banque: "Banque Islamique du Sénégal N° SN 079 01104 251076737001 / 24", email: "2aservices2018@gmail.com"
  };
  var S = load();
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.lines) return o; } } catch (e) {}
    return clone(DEFAULT);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var NB = " ";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return Math.round(n).toLocaleString("fr-FR").replace(/[  ]/g, NB); }
  var MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  function longDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); if (!m) return "";
    return parseInt(m[3], 10) + " " + MONTHS[parseInt(m[2], 10) - 1] + " " + m[1];
  }

  /* --- montant en lettres (français) --- */
  var U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  var T = ["","","vingt","trente","quarante","cinquante","soixante"];
  function b100(n, fin) {
    if (n < 20) return U[n];
    if (n < 70) { var t = Math.floor(n / 10), u = n % 10; return T[t] + (u === 1 ? " et un" : u ? "-" + U[u] : ""); }
    if (n < 80) { var v = n - 60; return v === 11 ? "soixante et onze" : "soixante-" + U[v]; }
    var w = n - 80; return w === 0 ? "quatre-vingt" + (fin ? "s" : "") : "quatre-vingt-" + U[w];
  }
  function b1000(n, fin) {
    var h = Math.floor(n / 100), r = n % 100;
    if (h === 0) return b100(r, fin);
    if (h === 1) return "cent" + (r ? " " + b100(r, fin) : "");
    return U[h] + " cent" + (r ? " " + b100(r, fin) : (fin ? "s" : ""));
  }
  function words(n) {
    n = Math.round(n); if (n === 0) return "zéro";
    var out = [], bn = Math.floor(n / 1e9), m = Math.floor(n / 1e6) % 1000, k = Math.floor(n / 1e3) % 1000, r = n % 1000;
    if (bn) out.push(bn === 1 ? "un milliard" : b1000(bn, true) + " milliards");
    if (m) out.push(m === 1 ? "un million" : b1000(m, true) + " millions");
    if (k) out.push(k === 1 ? "mille" : b1000(k, false) + " mille");
    if (r) out.push(b1000(r, true));
    return out.join(" ");
  }

  function totals() {
    var sub = 0;
    S.lines.forEach(function (l) { sub += (+l.q || 0) * (+l.p || 0); });
    var rem = Math.min(+S.remise || 0, sub), base = sub - rem, tva = base * ((+S.tva || 0) / 100);
    return { sub: sub, rem: rem, tva: tva, total: base + tva };
  }

    if (t.rem || +S.tva) sub += '<div class="r"><span>Sous-total</span><span>' + fmt(t.sub) + '</span></div>';
    if (t.rem) sub += '<div class="r"><span>Remise</span><span>− ' + fmt(t.rem) + '</span></div>';
    if (+S.tva) sub += '<div class="r"><span>TVA ' + esc(S.tva) + ' %</span><span>' + fmt(t.tva) + '</span></div>';
    var nbLines = S.nb.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    var nb = nbLines.length ? '<div class="nb"><h4>NB :</h4><ul>' + nbLines.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ul></div>' : '<div></div>';
    var w = words(t.total).toUpperCase();
    document.getElementById("sheet").innerHTML =
      '<div class="wm" aria-hidden="true">' + LOGO + '</div>' +
      '<div class="head"><div class="logo">' + LOGO + '</div>' +
      '<div class="title"><div class="kicker">Document</div><h2>Facture</h2><div class="num">N°' + NB + numHtml + '</div></div></div>' +
      '<div class="meta"><div><div class="k">Facturé à</div><div class="who">' + esc(S.client) + '</div><div class="sub">' + esc(S.ville) + '</div></div>' +
      '<div class="when"><div class="k">Date d\'émission</div><div class="v">' + esc(S.lieu) + ', le ' + esc(longDate(S.date)) + '</div></div></div>' +
      '<table class="items"><thead><tr><th>Désignation</th><th class="q">Qté</th><th>P. Unitaire</th><th>P. Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="totals">' + sub + '<div class="grand"><span>Montant total</span><b>' + fmt(t.total) + ' FCFA</b></div></div>' +
      '<div class="words"><small>Arrêtée la présente facture à la somme de</small><strong>' + esc(w) + ' FRANCS CFA.</strong></div>' +
      '<div class="foot">' + nb + '<div class="sign"><div class="dir">LA DIRECTION</div>' + stamp() + '</div></div>' +
      '<div class="bottom"><i class="rl"></i><div>' + esc(S.adresse) + '</div><div>RC: ' + esc(S.rc) + ' – NINEA:' + esc(S.ninea) + ' - Tél : ' + esc(S.tel) + '</div>' +
      '<div><b>Compte Bancaire : ' + esc(S.banque) + '</b></div><div>Email : <u>' + esc(S.email) + '</u></div></div>';
  }

  /* --- form --- */
  var linesEl = document.getElementById("lines");
  function renderLines() {
    linesEl.innerHTML = "";
    S.lines.forEach(function (l, i) {
      var d = document.createElement("div"); d.className = "line";
      d.innerHTML =
        '<label class="desig" for="ld' + i + '">Désignation<input id="ld' + i + '" data-i="' + i + '" data-f="d" type="text" value="' + esc(l.d) + '"></label>' +
        '<label class="desig" for="ln' + i + '">Précision (facultatif)<input id="ln' + i + '" data-i="' + i + '" data-f="n" type="text" placeholder="Ex. : format A4, 500 exemplaires" value="' + esc(l.n || "") + '"></label>' +
        '<label for="lq' + i + '">Qté<input id="lq' + i + '" data-i="' + i + '" data-f="q" type="number" min="0" step="1" inputmode="numeric" value="' + esc(l.q) + '"></label>' +
        '<label for="lp' + i + '">P. unitaire<input id="lp' + i + '" data-i="' + i + '" data-f="p" type="number" min="0" step="500" inputmode="numeric" value="' + esc(l.p) + '"></label>' +
        '<button type="button" class="btn icon rm" data-rm="' + i + '" aria-label="Supprimer la ligne ' + (i + 1) + '">×</button>' +
        '<div class="sub" id="ls' + i + '">Total : ' + fmt((+l.q || 0) * (+l.p || 0)) + ' FCFA</div>';
      linesEl.appendChild(d);
    });
  }
  linesEl.addEventListener("input", function (e) {
    var el = e.target, i = el.getAttribute("data-i"), f = el.getAttribute("data-f");
    if (i == null) return;
    S.lines[i][f] = (f === "d" || f === "n") ? el.value : el.value === "" ? 0 : parseFloat(el.value);
    var l = S.lines[i]; document.getElementById("ls" + i).textContent = "Total : " + fmt((+l.q || 0) * (+l.p || 0)) + " FCFA";
    update();
  });
  linesEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-rm]"); if (!b) return;
    S.lines.splice(+b.getAttribute("data-rm"), 1);
    if (!S.lines.length) S.lines.push({ d: "", q: 1, p: 0 });
    renderLines(); update();
  });
  document.getElementById("add").addEventListener("click", function () {
    S.lines.push({ d: "", q: 1, p: 0 }); renderLines(); update();
    var last = document.getElementById("ld" + (S.lines.length - 1)); if (last) last.focus();
  });
  document.getElementById("form").addEventListener("input", function (e) {
    var k = e.target.getAttribute("data-k"); if (!k) return;
    S[k] = e.target.type === "number" ? (e.target.value === "" ? 0 : parseFloat(e.target.value)) : e.target.value;
    update();
  });
  document.getElementById("form").addEventListener("submit", function (e) { e.preventDefault(); });
  function fillFields() {
    document.querySelectorAll("[data-k]").forEach(function (el) { var v = S[el.getAttribute("data-k")]; el.value = v == null ? "" : v; });
  }
  function update() { renderPaper(); save(); }

  /* --- actions --- */
  var toast = document.getElementById("toast"), tt;
  function say(msg) { toast.textContent = msg; clearTimeout(tt); tt = setTimeout(function () { toast.textContent = ""; }, 2600); }
  document.getElementById("copy").addEventListener("click", function () {
    var t = totals();
    var txt = "FACTURE N°" + S.num + "\n" + S.lieu + ", le " + longDate(S.date) + "\nClient : " + S.client + " (" + S.ville + ")\n\n" +
      S.lines.map(function (l) { return "- " + l.d + (String(l.n || "").trim() ? " (" + String(l.n).trim() + ")" : "") + " : " + pad2(l.q) + " x " + fmt(+l.p || 0) + " = " + fmt((+l.q || 0) * (+l.p || 0)) + " FCFA"; }).join("\n") +
      "\n\nMONTANT TOTAL : " + fmt(t.total) + " FCFA\nArrêtée la présente facture à la somme de : " + words(t.total).toUpperCase() + " FRANCS CFA.\n\nNB :\n" +
      S.nb.split("\n").filter(function (s) { return s.trim(); }).map(function (s) { return "- " + s.trim(); }).join("\n");
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); say(ok ? "Texte copié." : "Copie impossible, sélectionnez le texte à la main.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { say("Texte copié."); }, fallback);
    else fallback();
  });
  document.getElementById("fresh").addEventListener("click", function () {
    var m = /^(\d+)-(\d+)$/.exec(S.num), d = new Date(), y = String(d.getFullYear()).slice(2);
    var n = m ? String(parseInt(m[1], 10) + 1) : "1";
    S.num = n + "-" + (m ? m[2] : y);
    S.client = ""; S.ville = ""; S.lines = [{ d: "", q: 1, p: 0 }]; S.remise = 0;
    S.date = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    fillFields(); renderLines(); update(); say("Nouvelle facture n°" + S.num + " prête.");
    document.getElementById("client").focus();
  });

  fillFields(); renderLines(); renderPaper();
})();
</script>
</body>
</html>
